<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korzinka Family</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f4f5f7; margin: 0; padding: 15px; color: #222; }
    .header { text-align: center; font-weight: bold; font-size: 20px; color: #e53935; margin-bottom: 12px; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; font-size: 15px; box-sizing: border-box; margin-bottom: 15px; outline: none; background: #fff; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 70px; }
    .card { background: #fff; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; }
    .card img { width: 100%; height: 100px; object-fit: contain; border-radius: 8px; margin-bottom: 8px; }
    .card-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-price { font-size: 13px; color: #e53935; font-weight: bold; margin-bottom: 8px; }
    
    .btn { background: #e53935; color: white; border: none; padding: 8px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
    .cart-bar { position: fixed; bottom: 15px; left: 15px; right: 15px; background: #2e7d32; color: white; padding: 14px; border-radius: 12px; text-align: center; font-weight: bold; display: none; cursor: pointer; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: flex-end; }
    .modal-content { background: #fff; width: 100%; border-radius: 20px 20px 0 0; padding: 20px; box-sizing: border-box; animation: slideUp 0.2s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-img { width: 100%; height: 180px; object-fit: contain; }
    .close-btn { background: #eee; border: none; padding: 8px 16px; border-radius: 8px; float: right; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">🛒 Семейный Заказ</div>
  <input type="text" id="searchInput" placeholder="Поиск по каталогу..." oninput="filterItems()">
  
  <div id="grid" class="grid"></div>
  <div id="cartBar" class="cart-bar" onclick="sendOrder()">Отправить заказ</div>

  <div id="modal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <img id="mImg" class="modal-img" src="">
      <h3 id="mTitle" style="margin:10px 0 5px 0;"></h3>
      <div id="mPrice" style="color:#e53935; font-weight:bold; font-size:18px; margin-bottom:10px;"></div>
      <p id="mDesc" style="color:#666; font-size:14px; line-height:1.4; margin-bottom:15px;"></p>
      <button id="mAddBtn" class="btn" style="width:100%; padding:12px; font-size:15px;"></button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const products = [
      { id: 1, name: "Молоко 3.2% 1л", price: 12000, img: "https://images.unsplash.com/photo-1563636619-e9143da7973b?w=300", desc: "Свежее пастеризованное коровье молоко высокой жирности. Отлично подходит для каш и кофе." },
      { id: 2, name: "Хлеб формовой", price: 3000, img: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=300", desc: "Традиционный белый хлеб из пшеничной муки высшего сорта. Выпекается ежедневно." },
      { id: 3, name: "Яйца C1 (10 шт)", price: 16000, img: "https://images.unsplash.com/photo-1582721478779-0ae163c05a60?w=300", desc: "Отборные столовые яйца категории С1. Источник белка для правильного питания." },
      { id: 4, name: "Масло сливочное 82%", price: 28000, img: "https://images.unsplash.com/photo-1589985270826-4b7bb135bc9d?w=300", desc: "Натуральное сливочное масло без растительных жиров и добавок." },
      { id: 5, name: "Бананы 1 кг", price: 22000, img: "https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=300", desc: "Сладкие спелые бананы. Богаты калием и витаминами." },
      { id: 6, name: "Сыр Гауда 200г", price: 31000, img: "https://images.unsplash.com/photo-1486297678162-eb2a19b0a32d?w=300", desc: "Полутвердый сыр со сливочным вкусом. Идеален для бутербродов и горячих блюд." }
    ];

    let cart = {};
    let currentModalId = null;

    function render(list) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      list.forEach(p => {
        const count = cart[p.id] ? cart[p.id].count : 0;
        const div = document.createElement('div');
        div.className = 'card';
        div.onclick = () => openModal(p);
        div.innerHTML = `
          <img src="${p.img}" alt="${p.name}">
          <div class="card-title">${p.name}</div>
          <div class="card-price">${p.price.toLocaleString()} сум</div>
          <button class="btn" onclick="event.stopPropagation(); addToCart(${p.id})">
            ${count > 0 ? '✓ (' + count + ')' : '+ Добавить'}
          </button>
        `;
        grid.appendChild(div);
      });
    }

    function openModal(p) {
      currentModalId = p.id;
      document.getElementById('mImg').src = p.img;
      document.getElementById('mTitle').innerText = p.name;
      document.getElementById('mPrice').innerText = p.price.toLocaleString() + ' сум';
      document.getElementById('mDesc').innerText = p.desc;
      updateModalBtn();
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    function updateModalBtn() {
      const count = cart[currentModalId] ? cart[currentModalId].count : 0;
      const btn = document.getElementById('mAddBtn');
      btn.innerText = count > 0 ? `В корзине: ${count} шт. (Добавить еще)` : 'Добавить в корзину';
      btn.onclick = () => { addToCart(currentModalId); updateModalBtn(); };
    }

    function addToCart(id) {
      const p = products.find(item => item.id === id);
      if (!cart[id]) cart[id] = { name: p.name, price: p.price, count: 1 };
      else cart[id].count++;
      updateCartBar();
      render(products);
    }

    function filterItems() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      render(products.filter(p => p.name.toLowerCase().includes(q)));
    }

    function updateCartBar() {
      const bar = document.getElementById('cartBar');
      const totalItems = Object.values(cart).reduce((a, b) => a + b.count, 0);
      let totalSum = 0;
      Object.values(cart).forEach(i => totalSum += i.price * i.count);
      
      if (totalItems > 0) {
        bar.style.display = 'block';
        bar.innerText = `Заказать (${totalItems}) • ${totalSum.toLocaleString()} сум`;
      } else bar.style.display = 'none';
    }

    function sendOrder() { tg.sendData(JSON.stringify(cart)); }

    render(products);
  </script>
</body>
</html>
